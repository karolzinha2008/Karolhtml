<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Letreiro Motivacional Delicado</title>

<style>
  /* ======= ESTILO GERAL ======= */
  body {
    background: linear-gradient(135deg, #ffeaf4 0%, #fff6fa 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Poppins', sans-serif;
  }

  /* ======= ÁREA DO LETREIRO ======= */
  .letreiro-container {
    position: relative;
    width: 80%;
    height: 100px;
    overflow: hidden;
    border: 3px solid #f8b6d8;
    border-radius: 20px;
    background-color: #fff;
    box-shadow: 0 0 25px rgba(255, 182, 193, 0.4);
    padding: 10px 20px;
  }

  /* ======= TEXTO DO LETREIRO ======= */
  .letreiro-texto {
    position: absolute;
    white-space: nowrap;
    font-family: 'Great Vibes', cursive;
    font-size: 2.2em;
    color: #e75480;
    font-weight: 400;
    left: 0;
  }

  /* Importa fontes delicadas do Google Fonts */
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap');
</style>
</head>
<body>

  <div class="letreiro-container">
    <div class="letreiro-texto">🌷 Acredite no seu brilho — você é capaz de tudo que sonhar! ✨</div>
  </div>

<script>
  // ======= ANIMAÇÃO DO LETREIRO =======
  const texto = document.querySelector('.letreiro-texto');
  const container = document.querySelector('.letreiro-container');

  let posX = 0;
  let direcao = 1; // 1 = direita, -1 = esquerda
  let velocidade = 1.5; // Controle da velocidade (px por frame)

  function animarLetreiro() {
    const limiteDireita = container.clientWidth - texto.clientWidth;

    posX += direcao * velocidade;

    // Inverta direção ao atingir limites
    if (posX >= limiteDireita) {
      direcao = -1;
    } else if (posX <= 0) {
      direcao = 1;
    }

    texto.style.left = posX + 'px';

    requestAnimationFrame(animarLetreiro);
  }

  animarLetreiro();
</script>

</body>
</html>
